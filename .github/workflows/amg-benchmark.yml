name: AMG scale benchmark
on:
  workflow_dispatch:
    inputs:
      sizes:
        description: "Synthetic entity counts"
        type: choice
        options:
          - "1000 10000 100000"
          - "1000"
          - "10000"
          - "100000"
        default: "1000 10000 100000"
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false
      - name: Provision locked dependencies
        run: |
          pkg-config --modversion sqlite3
          cargo fetch --locked
      - name: Run scale benchmarks
        env:
          AMG_SIZES: ${{ inputs.sizes }}
          AMG_SAMPLES: "100"
          AMG_RECOVERY: "1"
        run: bash scripts/benchmark-amg.sh $AMG_SIZES
