name: Offline Rust tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          rustc --version
          cargo --version
      - name: Provision locked build dependencies
        run: |
          pkg-config --modversion sqlite3
          cargo fetch --locked
      - name: Test and smoke
        run: bash scripts/test.sh
      - name: Text-only benchmark
        run: bash scripts/benchmark.sh

      - name: Active AMG benchmark (synthetic 1k)
        run: AMG_SAMPLES=100 timeout --kill-after=5s 120s bash scripts/benchmark-amg.sh 1000
