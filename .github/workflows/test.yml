name: Offline Rust tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Toolchain
        run: |
          rustc --version
          cargo --version
      - name: Public text and metadata pattern check
        run: python3 scripts/check-publication.py
      - name: Provision locked build dependencies
        run: |
          pkg-config --modversion sqlite3
          cargo fetch --locked
      - name: Test and smoke
        run: bash scripts/test.sh
      - name: Responses replay tests and parser benchmark
        run: timeout --kill-after=5s 120s bash scripts/test-responses.sh
      - name: Offline authentication protocol and storage tests
        run: |
          node --version
          timeout --kill-after=5s 30s node --test scripts/auth/protocol.test.mjs
          node --check scripts/auth/atomos-auth.mjs
          # Validate password prompt flags without prompting for a secret.
          /usr/bin/systemd-ask-password --timeout=60 --echo=no --help >/dev/null
      - name: Atomic admission candidate tests and durable benchmark
        run: |
          command -v strace || (sudo apt-get update && sudo apt-get install -y strace)
          timeout --kill-after=5s 120s bash scripts/test-atomic-admission.sh
      - name: Frozen strict versus extended atomic outcome benchmark
        run: timeout --kill-after=5s 180s bash scripts/benchmark-outcomes.sh
      - name: CLI session regression and frozen legacy comparison
        # Session tests include a separately compiled historical CLI reference.
        # Full checkout history is already provisioned above.
        run: |
          timeout --kill-after=5s 180s bash scripts/test-session.sh
      - name: Session overhead, accounting and pipe benchmark
        run: timeout --kill-after=5s 180s bash scripts/benchmark-session.sh
      - name: Candidate minimum compiler compatibility
        run: |
          rustup toolchain install 1.75.0 --profile minimal
          # Explicit package-only provisioning: older Cargo cannot fetch the
          # unrelated workspace's existing edition-2024 getrandom package.
          cargo +1.75.0 check --locked -p atomos-core --features atomic-admission
          cargo +1.75.0 test --locked --offline -p atomos-core --features atomic-admission --all-targets
      - name: Text-only benchmark
        run: bash scripts/benchmark.sh

      - name: Active AMG benchmark (synthetic 1k)
        run: AMG_SAMPLES=100 timeout --kill-after=5s 120s bash scripts/benchmark-amg.sh 1000
