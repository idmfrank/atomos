name: Offline Rust tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          rustc --version
          cargo --version
      - name: Bootstrap dependency lock (temporary M1.4 branch step)
        run: |
          pkg-config --modversion sqlite3
          cargo generate-lockfile
          cat Cargo.lock
          cargo fetch --locked
      - name: Test and smoke
        run: bash scripts/test.sh
      - name: Text-only benchmark
        run: bash scripts/benchmark.sh
