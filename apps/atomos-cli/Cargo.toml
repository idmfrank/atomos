[package]
name = "atomos-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = []
session-replay = ["atomos-core/atomic-admission"]

[[bin]]
name = "atomos"
path = "src/main.rs"

[dependencies]
atomos-core = { path = "../../crates/atomos-core" }
atomos-memory = { path = "../../crates/atomos-memory" }
