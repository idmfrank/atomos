[package]
name = "atomos-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]

[features]
default = []
responses-replay = ["dep:serde", "dep:serde_json"]
atomic-admission = ["responses-replay", "dep:sha2"]

[dependencies.sha2]
version = "=0.10.9"
optional = true

[dependencies.serde]
version = "=1.0.228"
optional = true

[dependencies.serde_json]
version = "=1.0.145"
optional = true

[[example]]
name = "responses_bench"
required-features = ["responses-replay"]

[[example]]
name = "responses_qualify"
required-features = ["responses-replay"]

[[example]]
name = "admission_bench"
required-features = ["responses-replay"]

[[example]]
name = "outcome_bench"
required-features = ["atomic-admission"]

[[example]]
name = "session_bench"
required-features = ["atomic-admission"]
